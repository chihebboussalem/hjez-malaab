<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>حجز الملعب البلدي</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">

  <!-- ===== البانر: رسمة الملعب + العنوان ===== -->
  <header class="hero">
    <svg class="hero-pitch" viewBox="0 0 300 190" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
      <rect width="300" height="190" fill="var(--pitch-green)"/>
      <rect x="30" y="20" width="240" height="150" fill="none" stroke="var(--line)" stroke-width="2"/>
      <line x1="150" y1="20" x2="150" y2="170" stroke="var(--line)" stroke-width="2"/>
      <circle cx="150" cy="95" r="26" fill="none" stroke="var(--line)" stroke-width="2"/>
      <circle cx="150" cy="95" r="2" fill="var(--line)"/>
      <rect x="30" y="55" width="34" height="80" fill="none" stroke="var(--line)" stroke-width="2"/>
      <rect x="236" y="55" width="34" height="80" fill="none" stroke="var(--line)" stroke-width="2"/>
      <rect x="30" y="75" width="14" height="40" fill="none" stroke="var(--line)" stroke-width="2"/>
      <rect x="256" y="75" width="14" height="40" fill="none" stroke="var(--line)" stroke-width="2"/>
      <path d="M 30 20 A 10 10 0 0 1 40 20" fill="none" stroke="var(--line)" stroke-width="2"/>
      <path d="M 30 170 A 10 10 0 0 0 40 170" fill="none" stroke="var(--line)" stroke-width="2"/>
      <path d="M 270 20 A 10 10 0 0 0 260 20" fill="none" stroke="var(--line)" stroke-width="2"/>
      <path d="M 270 170 A 10 10 0 0 1 260 170" fill="none" stroke="var(--line)" stroke-width="2"/>
    </svg>
    <div class="hero-overlay"></div>
    <div class="hero-content">
      <p class="eyebrow">الملعب البلدي</p>
      <h1>حجز الملعب</h1>
      <p class="subtitle">اختر اليوم والوقت، وأدخل معلوماتك للتأكيد</p>
    </div>
  </header>

  <!-- ===== خطوة 1: اختيار اليوم ===== -->
  <h2>اختر اليوم</h2>
  <div class="days" id="daysContainer"></div>

  <!-- ===== خطوة 2: اختيار الوقت ===== -->
  <h2>اختر الوقت</h2>
  <div class="slots" id="slotsContainer"></div>

  <!-- ===== خطوة 3: استمارة الحجز والدفع ===== -->
  <div class="form-box" id="formBox">
    <h2>معلومات الحجز</h2>

    <label for="fullName">الاسم الكامل</label>
    <input type="text" id="fullName" placeholder="مثال: أحمد بن علي">

    <label for="phone">رقم الهاتف</label>
    <input type="tel" id="phone" placeholder="0555 12 34 56">

    <label>طريقة الدفع</label>
    <div class="pay-choice">
      <label>
        <input type="radio" name="payMethod" value="online" checked>
        <span>الدفع أونلاين</span>
      </label>
      <label>
        <input type="radio" name="payMethod" value="onsite">
        <span>الدفع في الملعب</span>
      </label>
    </div>

    <button class="submit-btn" onclick="confirmBooking()">تأكيد الحجز</button>
  </div>

  <!-- ===== خطوة 4: رسالة التأكيد ===== -->
  <div class="confirmation" id="confirmationBox">
    <div class="check">✔</div>
    <h2 id="confirmTitle">تم تأكيد حجزك</h2>
    <p id="confirmDetails"></p>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
